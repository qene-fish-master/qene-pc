<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6eeee">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FLAPPY JUMP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>青魚 FLAPPY JUMP</title>
<link rel="stylesheet" href="qy.css">
<style>
.bw{width:max(200px,min(92vw,380px,calc((100dvh - 230px) * 2 / 3)));aspect-ratio:2/3;border-radius:12px;overflow:hidden;touch-action:none;cursor:pointer}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<header class="top"><a class="back" href="index.html">🐟 大廳</a><h1>FLAPPY JUMP</h1><button class="ib" id="bTheme" type="button">🌓</button></header>
<div class="stats"><div class="stat"><small>分數</small><b id="sc">0</b></div><div class="stat"><small>最高分</small><b id="bs">0</b></div></div>
<div class="bw" id="bw"><canvas id="cv"></canvas></div>
<div class="bar"><button class="btn p" id="bNew" type="button">重新開始</button></div>
<p class="tip">點擊畫面、按空白鍵或 ↑ 讓小魚跳起,穿過水管縫隙</p>
<script src="qy.js"></script>
<script>
const {$,LS}=QY,W=360,H=540,GR=70,BX=92,BR=12,PW=58,GAP=150,SPD=150,GRAV=1500,FLAP=-430,INT=1.5;
const cv=$('#cv'),cx=cv.getContext('2d');
let state='ready',bird,pipes,score,best=+LS.get('qy.best.flappy',0)||0,t=0,acc=0,last=0,deadAt=0,gx=0,lastGap=0,nextP=0;
$('#bs').textContent=best;
function reset(){
 bird={y:H/2-GR/2,vy:0,rot:0};pipes=[];score=0;t=0;acc=0;gx=0;nextP=0.9;lastGap=(H-GR)/2;state='ready';
 $('#sc').textContent=0;
}
function resize(){
 const w=$('#bw').clientWidth,dpr=window.devicePixelRatio||1;
 cv.width=Math.round(w*dpr);cv.height=Math.round(w*1.5*dpr);cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
function addPipe(){
 const lo=64,hi=H-GR-64-GAP;
 let c=lastGap+(Math.random()*2-1)*170;
 c=Math.max(lo,Math.min(hi,c));lastGap=c;
 pipes.push({x:W+10,top:c,passed:false});
}
function flap(){
 if(state==='dead'){if(performance.now()-deadAt>600)reset();return}
 if(state==='ready'){state='play';bird.vy=FLAP;return}
 bird.vy=FLAP;
}
function die(){
 if(state==='dead')return;
 state='dead';deadAt=performance.now();
 if(score>best){best=score;LS.set('qy.best.flappy',best);$('#bs').textContent=best}
}
function hit(){
 if(bird.y+BR>=H-GR){bird.y=H-GR-BR;return true}
 for(const p of pipes){
  const rects=[[p.x,0,PW,p.top],[p.x-4,p.top-24,PW+8,24],[p.x,p.top+GAP,PW,H],[p.x-4,p.top+GAP,PW+8,24]];
  for(const [x,y,w,h] of rects){
   const nx=Math.max(x,Math.min(BX,x+w)),ny=Math.max(y,Math.min(bird.y,y+h));
   if((BX-nx)**2+(bird.y-ny)**2<(BR-1)**2)return true;
  }
 }
 return false;
}
function step(dt){
 if(state==='ready'){t+=dt;bird.y=H/2-GR/2+Math.sin(t*5)*8;gx=(gx+SPD*dt)%24;return}
 if(state==='dead'){
  if(bird.y+BR<H-GR){bird.vy+=GRAV*dt;bird.y+=bird.vy*dt;bird.rot=Math.min(1.4,bird.rot+6*dt);if(bird.y+BR>H-GR)bird.y=H-GR-BR}
  return;
 }
 t+=dt;gx=(gx+SPD*dt)%24;
 bird.vy+=GRAV*dt;bird.y+=bird.vy*dt;
 if(bird.y<BR){bird.y=BR;if(bird.vy<0)bird.vy=0}
 bird.rot=Math.max(-.5,Math.min(1.2,bird.vy/600));
 nextP-=dt;if(nextP<=0){addPipe();nextP+=INT}
 for(const p of pipes){p.x-=SPD*dt;if(!p.passed&&p.x+PW<BX-BR){p.passed=true;score++;$('#sc').textContent=score}}
 while(pipes.length&&pipes[0].x<-PW-10)pipes.shift();
 if(hit())die();
}
function dark(){
 const v=document.documentElement.dataset.theme;
 return v==='dark'||(!v&&matchMedia('(prefers-color-scheme:dark)').matches);
}
function draw(){
 const d=dark();
 const g=cx.createLinearGradient(0,0,0,H-GR);
 if(d){g.addColorStop(0,'#0b1a2b');g.addColorStop(1,'#1b3b52')}else{g.addColorStop(0,'#8fd3ee');g.addColorStop(1,'#dff4f6')}
 cx.fillStyle=g;cx.fillRect(0,0,W,H);
 // pipes
 for(const p of pipes){
  cx.fillStyle=d?'#2d8a6a':'#3cb88a';
  cx.fillRect(p.x,0,PW,p.top);cx.fillRect(p.x,p.top+GAP,PW,H-GR-p.top-GAP);
  cx.fillStyle=d?'#237256':'#2e9e6b';
  cx.fillRect(p.x-4,p.top-24,PW+8,24);cx.fillRect(p.x-4,p.top+GAP,PW+8,24);
  cx.fillStyle='rgba(255,255,255,.18)';
  cx.fillRect(p.x+6,0,8,p.top-24);cx.fillRect(p.x+6,p.top+GAP+24,8,H-GR-p.top-GAP-24);
 }
 // ground
 cx.fillStyle=d?'#4a3a26':'#d9b878';cx.fillRect(0,H-GR,W,GR);
 cx.fillStyle=d?'#2f7a58':'#5ec28f';cx.fillRect(0,H-GR,W,10);
 cx.fillStyle='rgba(0,0,0,.12)';
 for(let x=-gx;x<W;x+=24)cx.fillRect(x,H-GR+10,12,6);
 // fish
 cx.save();cx.translate(BX,bird.y);cx.rotate(bird.rot);
 cx.fillStyle='#e9c36a';cx.beginPath();cx.moveTo(-10,0);cx.lineTo(-24,-10);cx.lineTo(-24,10);cx.closePath();cx.fill();
 cx.fillStyle='#1f6f8b';cx.beginPath();cx.ellipse(0,0,17,12,0,0,7);cx.fill();
 cx.fillStyle='#5fb3d0';cx.beginPath();cx.ellipse(1,4,11,6,0,0,Math.PI);cx.fill();
 const wy=Math.sin(t*22)*3;
 cx.fillStyle='#e9c36a';cx.beginPath();cx.ellipse(-3,2+wy*.3,7,4,-.5,0,7);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(8,-3,4,0,7);cx.fill();
 cx.fillStyle='#12303a';cx.beginPath();cx.arc(9,-3,2,0,7);cx.fill();
 cx.restore();
 // text
 cx.textAlign='center';cx.lineJoin='round';
 if(state!=='ready'){cx.font='800 48px system-ui,sans-serif';cx.lineWidth=6;cx.strokeStyle='rgba(0,0,0,.45)';cx.fillStyle='#fff';cx.strokeText(score,W/2,80);cx.fillText(score,W/2,80)}
 if(state==='ready'){
  cx.font='800 30px system-ui,sans-serif';cx.lineWidth=5;cx.strokeStyle='rgba(0,0,0,.45)';cx.fillStyle='#fff';
  cx.strokeText('FLAPPY JUMP',W/2,130);cx.fillText('FLAPPY JUMP',W/2,130);
  cx.font='700 18px system-ui,sans-serif';cx.lineWidth=4;
  cx.strokeText('點擊開始',W/2,H-GR-40);cx.fillText('點擊開始',W/2,H-GR-40);
 }
 if(state==='dead'){
  cx.font='800 34px system-ui,sans-serif';cx.lineWidth=6;cx.strokeStyle='rgba(0,0,0,.5)';cx.fillStyle='#fff';
  cx.strokeText('遊戲結束',W/2,190);cx.fillText('遊戲結束',W/2,190);
  cx.font='700 20px system-ui,sans-serif';cx.lineWidth=4;
  const m='分數 '+score+'・最高 '+best;cx.strokeText(m,W/2,230);cx.fillText(m,W/2,230);
  if(performance.now()-deadAt>600){cx.strokeText('點擊再玩一次',W/2,272);cx.fillText('點擊再玩一次',W/2,272)}
 }
}
function loop(ts){
 requestAnimationFrame(loop);
 if(!last){last=ts;return}
 let dt=(ts-last)/1000;last=ts;
 if(dt>0.1)dt=0.1;
 acc+=dt;
 const h=1/120;
 while(acc>=h){step(h);acc-=h}
 draw();
}
$('#bw').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();flap()});
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){e.preventDefault();if(!e.repeat)flap()}
});
$('#bNew').onclick=()=>{reset()};
document.addEventListener('visibilitychange',()=>{last=0;acc=0});
addEventListener('resize',resize);
reset();resize();requestAnimationFrame(loop);
</script>
</body>
</html>
